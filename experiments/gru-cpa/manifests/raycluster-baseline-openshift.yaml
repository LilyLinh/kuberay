# RayCluster for Baseline Experiment (HPA) - OpenShift
# Uses RHOAI Ray image for compatibility
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: baseline-cluster
  namespace: gru-cpa-experiment
spec:
  rayVersion: '2.35.0'
  enableInTreeAutoscaling: false
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
    template:
      spec:
        containers:
          - name: ray-head
            image: quay.io/modh/ray:2.35.0-py311-cu121
            ports:
              - containerPort: 6379
                name: gcs-server
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              limits:
                cpu: "2"
                memory: "4Gi"
              requests:
                cpu: "1"
                memory: "2Gi"
  workerGroupSpecs:
    - groupName: default-worker
      replicas: 1
      minReplicas: 1
      maxReplicas: 5
      rayStartParams:
        num-cpus: '2'
      template:
        spec:
          containers:
            - name: ray-worker
              image: quay.io/modh/ray:2.35.0-py311-cu121
              resources:
                limits:
                  cpu: "2"
                  memory: "4Gi"
                requests:
                  cpu: "1"
                  memory: "2Gi"

