---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gru-cpa-controller
  namespace: gru-cpa-experiment

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gru-cpa-controller
  namespace: gru-cpa-experiment
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gru-cpa-controller
  namespace: gru-cpa-experiment
subjects:
  - kind: ServiceAccount
    name: gru-cpa-controller
    namespace: gru-cpa-experiment
roleRef:
  kind: Role
  name: gru-cpa-controller
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gru-model
  namespace: gru-cpa-experiment
data:
  scaler_params.json: |
    {"mean": 37.98, "std": 44.79}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gru-cpa-controller
  namespace: gru-cpa-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gru-cpa-controller
  template:
    metadata:
      labels:
        app: gru-cpa-controller
    spec:
      serviceAccountName: gru-cpa-controller
      containers:
        - name: controller
          image: gru-cpa-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RAYCLUSTER_NAME
              value: "test-cluster"
            - name: SCALE_INTERVAL
              value: "10"
            - name: SEQUENCE_LENGTH
              value: "30"
            - name: TASKS_PER_WORKER
              value: "20"
            - name: MIN_REPLICAS
              value: "1"
            - name: MAX_REPLICAS
              value: "10"
            - name: SCALE_UP_BUFFER
              value: "1.2"
            - name: MODEL_PATH
              value: "/app/model/gru_model.keras"
            - name: SCALER_PATH
              value: "/app/model/scaler_params.json"
            - name: RAY_DASHBOARD_URL
              value: "http://test-cluster-head-svc:8265"
